[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigstore-cosign-mcp"
readme = "README.md"
version = "1.0.4"
description = "Sigstore cosign + rekor transparency log verification for signed container images + git tags + binaries."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "hello@meok.ai"}]
keywords = ["sigstore", "cosign", "rekor", "transparency-log", "signing", "mcp", "mcp-server", "model-context-protocol", "ai-governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/sigstore-cosign-mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[project.scripts]
sigstore-cosign-mcp = "server:main"
